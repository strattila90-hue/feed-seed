name: Weboldal frissítése
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: main → gh-pages (GitHub Pages)
        run: git push origin HEAD:gh-pages --force
