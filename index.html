<!DOCTYPE html><html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>Feed&amp;Seed</title>
<style>
:root{--g:#9be15d;--d:#0d1b2a;--px:#e8f5d0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--d);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Courier New",ui-monospace,monospace;color:var(--px)}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;filter:saturate(1.15) contrast(1.05)}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,#0a142866 100%),linear-gradient(#ffffff12,transparent 18%)}
#hud{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;display:flex;align-items:center;gap:10px;padding:10px 12px;pointer-events:none}
#lv{font:bold 12px "Courier New",monospace;padding:7px 10px;white-space:nowrap;letter-spacing:1px;text-shadow:1px 1px #000;background:linear-gradient(#3b7a31,#1f4a1f);border:2px solid #0d2a12;outline:2px solid var(--g);box-shadow:inset 0 2px 0 #ffffff40,0 3px 0 #0a1a0a}
#bar{flex:1;height:14px;padding:2px;background:#0a1a2acc;border:2px solid #e8f5d0aa;box-shadow:0 3px 0 #0006,inset 0 2px 0 #0008}
#fill{height:100%;width:0;position:relative;background:repeating-linear-gradient(90deg,#b6f26a 0 4px,#7bc943 4px 8px);transition:width .3s steps(8);box-shadow:0 0 10px #9be15d99}
#fill::after{content:"";position:absolute;inset:0 0 50% 0;background:#ffffff55}
#pb{pointer-events:auto;display:grid;place-items:center;width:38px;height:38px;padding:0;background:linear-gradient(#35506e,#1d3047);border:2px solid #0a1420;outline:2px solid #9fc3e8;box-shadow:inset 0 2px 0 #ffffff40,0 3px 0 #0a1420}
#pb::before{content:"";width:4px;height:14px;background:var(--px);box-shadow:8px 0 var(--px);margin-right:8px}
#pb:active{transform:translateY(3px);box-shadow:inset 0 2px 0 #ffffff30}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 105%,#2d6a2799,transparent 60%),linear-gradient(#0d1b2af0,#10261ff0);backdrop-filter:blur(6px) saturate(1.2);animation:fade .5s}
#menu::before{content:"";position:absolute;inset:0;opacity:.7;background-image:radial-gradient(#9be15d66 1px,transparent 1.6px),radial-gradient(#ffe27a55 1px,transparent 1.6px);background-size:46px 46px,71px 71px;background-position:0 0,23px 31px;animation:drift 20s linear infinite}
#menu>*{position:relative}
#menu h1{font-size:42px;margin:0;letter-spacing:3px;color:#b8f56d;text-shadow:0 3px 0 #2d6a22,0 6px 0 #1b3a1c,0 10px 16px #000a;animation:bob 3.2s ease-in-out infinite}
#menu small{opacity:.8;margin:0 0 16px;letter-spacing:2px;font-size:12px}
.b{width:244px;padding:13px 10px;font:bold 16px "Courier New",monospace;letter-spacing:1px;color:#f2ffd9;text-shadow:1px 2px #0008;background:linear-gradient(#4a9a3c,#2d6a27);border:3px solid #0d2a12;outline:3px solid var(--g);box-shadow:inset 0 3px 0 #ffffff44,inset 0 -4px 0 #0004,0 5px 0 #0a1a0a;transition:transform .08s}
.b:active{transform:translateY(4px);box-shadow:inset 0 3px 0 #ffffff33,0 1px 0 #0a1a0a}
.b.s{background:linear-gradient(#5b6f8a,#364a63);outline-color:#9fc3e8}
#hint,#toast{position:fixed;left:50%;width:max-content;max-width:86%;text-align:center;pointer-events:none;font-size:15px;letter-spacing:1px;text-shadow:2px 2px #000}
#hint{bottom:20%;padding:9px 16px;background:#0a1a2acc;border:2px solid var(--g);box-shadow:0 4px 0 #0008;animation:pulse 2s ease-in-out infinite}
#toast{top:calc(env(safe-area-inset-top,0px) + 66px);padding:10px 16px;background:linear-gradient(#1b3a1ce8,#0d1b2ae8);border:2px solid #ffe27a;box-shadow:0 4px 0 #0008,0 0 18px #ffe27a44;opacity:0;transform:translateX(-50%) translateY(-12px);transition:opacity .5s,transform .5s}
#toast.on{opacity:1;transform:translateX(-50%)}
#dbg{position:fixed;left:6px;bottom:6px;margin:0;padding:6px 8px;font:11px monospace;background:#000b;color:#9be15d;pointer-events:none;white-space:pre-wrap;max-width:92%;z-index:9}
.hide{display:none!important}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes drift{to{background-position:0 460px,23px 600px}}
@keyframes fade{from{opacity:0}}
@keyframes pulse{0%,100%{transform:translateX(-50%)}50%{transform:translateX(-50%) translateY(-5px);opacity:.7}}
</style></head><body>
<canvas id="c"></canvas><div id="vig"></div>
<div id="hud" class="hide"><span id="lv"></span><div id="bar"><div id="fill"></div></div><button id="pb" aria-label="Szünet"></button></div>
<div id="hint" class="hide">Koppints a mag elültetéséhez</div><div id="toast"></div><pre id="dbg" class="hide"></pre>
<div id="menu"><h1>Feed&amp;Seed</h1><small>a növekedés nyugodt játéka</small><button class="b" id="go">Játék indítása</button><button class="b" id="nw">Új játék</button><button class="b s" id="snd">Zene: be</button></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
const hs=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)},cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const lA=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t),rgb=a=>'rgb('+a.map(v=>v|0)+')';
const rc=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)},px=(x,y,c)=>rc(x,y,1,1,c);
const disc=(cx,cy,r,c)=>{for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r)px(cx+x,cy+y,c)};
let W=320,CX=160,U=1;const TL=8,MAXL=13,DAY=260,KEY='feedseed_v1',LEAF=['#1f5a2a','#2f7d32','#4caf3d','#8bd84e'];
let H=320,GY=240,S,paused=true,time=0,parts=[],ents=[],roots=[],pw=18,acc=0;
const soil=document.createElement('canvas');
const need=l=>6+l*5;
const fresh=()=>({v:3,pl:0,lvl:1,xp:0,wat:0,t:26,seed:1+Math.random()*900|0,fl:[],last:Date.now()});
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){S.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
{const L0=load();S=L0?Object.assign(fresh(),L0,{v:L0.v|0}):fresh();if(!Array.isArray(S.fl))S.fl=[];
 ['xp','wat','t'].forEach(k=>{if(!isFinite(S[k]))S[k]=0});S.lvl=cl(S.lvl|0||1,1,13);
 if(S.v<3){S.fl.forEach(f=>{if(f.dx==null){f.dx=(f.x||120)-120;delete f.x}});S.v=3}}
function size(){const ar=innerHeight/innerWidth;if(ar>=1){W=320;H=Math.round(W*ar)}else{H=440;W=Math.min(800,Math.round(H/ar))}H=Math.max(H,300);cv.width=W;cv.height=H;GY=H*.75|0;CX=W>>1;U=GY/380;
 soil.width=W;soil.height=H-GY;const c=soil.getContext('2d');
 for(let y=0;y<soil.height;y++)for(let x=0;x<W;x++){const r=hs(x*1.7+y*31.3),d=y/soil.height;
  const dd=d+Math.sin(x*.05+d*9)*.03,b=y<2?[66+(r*44|0),112,44]:y<4?(r>.5?[56,92,40]:[84,60,38]):dd<.35?[118,82,52]:dd<.7?[136,100,64]:[100,72,52],k=(r-.5)*18+(r>.93?20:0)-(r<.05?25:0)-(y>3?d*40:0);
  c.fillStyle='rgb('+b.map(v=>cl(v+k,0,255)|0)+')';c.fillRect(x,y,1,1)}
 for(let i=0;i<(W/9|0);i++){const rx=hs(i*3.3)*W|0,ry=(6+hs(i*7.1)*(soil.height-10))|0,rr=1+(hs(i)*2|0);c.fillStyle='#8d8a82';c.fillRect(rx,ry,rr+1,rr);c.fillStyle='#b8b5ab';c.fillRect(rx,ry,rr,1);c.fillStyle='#5e5b55';c.fillRect(rx+1,ry+rr,rr,1)}
 for(let i=0;i<4;i++){const by=(soil.height*(.2+.2*i))|0;c.fillStyle='rgba(25,12,4,.5)';for(let x=0;x<W;x++)c.fillRect(x,by+Math.sin(x*.06+i*2)*5+Math.sin(x*.19)*1.5|0,1,2)}
 for(let i=0;i<10;i++){const gx=hs(i*5.7)*W|0,gy=(soil.height*.55+hs(i*2.3)*soil.height*.4)|0;c.fillStyle=['#6ee7ff','#ff7ad9','#ffd36e'][i%3];c.fillRect(gx,gy,1,2);c.fillStyle='#fff8';c.fillRect(gx,gy,1,1)}
 const gr=c.createLinearGradient(0,0,0,soil.height);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.35)');c.fillStyle=gr;c.fillRect(0,0,W,soil.height);
 mkRoots();mkBranches();mkEnts()}
function mkRoots(){roots=[];const R=i=>hs(S.seed*9.1+i);let k=0;
 for(let i=0;i<14;i++){const a0=Math.PI*(.12+.76*i/13)+(R(k++)-.5)*.3;let a=a0,x=CX+(R(k++)-.5)*3,y=GY+1;const n=(22+R(k++)*34)*U|0,p=[];
  for(let s=0;s<n;s++){a+=(R(k++)-.5)*.5;a+=(Math.PI/2-a)*.04;x+=Math.cos(a)*1.3;y+=Math.sin(a)*1.3;if(y>H-2)break;p.push([x|0,y|0])}
  roots.push({p,s:0});
  if(p.length>14){let b=a0+(i%2?.9:-.9),x2=p[9][0],y2=p[9][1];const q=[];
   for(let s=0;s<14*U;s++){b+=(R(k++)-.5)*.6;x2+=Math.cos(b)*1.2;y2+=Math.sin(b)*1.2;if(y2>H-2||y2<GY+1)break;q.push([x2|0,y2|0])}
   roots.push({p:q,s:1})}}}
function addFlora(l){const n=5+l,m=Math.min(l,5);for(let i=0;i<n;i++){const d=10+Math.random()*(14+l*9);
 S.fl.push({dx:((Math.random()<.5?-1:1)*d)|0,t:m>1?(Math.random()*m)|0:0,c:Math.random(),s:Math.random()})}}
function mkEnts(){ents=[];const L=S.lvl,A=(k,n,f)=>{for(let i=0;i<n;i++)ents.push(Object.assign({k,x:Math.random()*W,y:0,v:(Math.random()<.5?-1:1)*(4+Math.random()*8),ph:Math.random()*9},f()))};
 if(L>=3)A('ant',Math.min(8,L),()=>({y:GY+6+Math.random()*(H-GY-12)}));
 if(L>=5)A('worm',Math.min(4,L-3),()=>({y:GY+14+Math.random()*(H-GY-22),v:(Math.random()<.5?-1:1)*(2+Math.random()*3)}));
 if(L>=7)A('bug',L>=10?3:2,()=>({y:GY+10+Math.random()*(H-GY-18)}));
 if(L>=4)A('sant',2,()=>({y:GY-1}));
 if(L>=9)A('bfly',Math.min(6,L-7),()=>({y:GY-20-Math.random()*40,v:6+Math.random()*6}));
 if(L>=10)A('bird',L>=12?3:2,()=>({y:15+Math.random()*GY*.3,v:14+Math.random()*10}));
 if(L>=11)A('ff',12,()=>({y:GY-5-Math.random()*40,v:2}))}
const MSG={2:'Virágok bújnak elő',3:'Gombák, páfrányok és hangyák',4:'Bokrok és sűrűbb fű',5:'Giliszták a talajban',6:'Magas virágok nyílnak',7:'Bogarak ásnak a gyökerek közt',8:'A fa szinte kifejlett!',9:'A fa kifejlett – a biom fejlődik: tó és pillangók',10:'Madarak érkeztek',11:'Szentjánosbogarak az éjszakában',12:'Erdőszél nő a láthatáron',13:'Teljes biom – gyönyörű!'};
let tt;function toast(s){const t=$('toast');t.textContent=s;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)}
function sparkle(x,y,n,c){for(let i=0;i<n;i++)parts.push({k:'z',x:x+(Math.random()-.5)*30,y:y-Math.random()*40,vx:(Math.random()-.5)*20,vy:-10-Math.random()*20,l:1.2,c})}
function gain(a){if(!S.pl)return;S.xp+=a;if(Math.random()<.4)sparkle(CX,GY-8,1,'#b6ff6b');
 while(S.xp>=need(S.lvl)&&S.lvl<MAXL){S.xp-=need(S.lvl);S.lvl++;addFlora(S.lvl);mkEnts();if(MSG[S.lvl])toast('Szint '+S.lvl+' – '+MSG[S.lvl]);sparkle(CX,GY-20,24,'#d4ff7a');save()}
 if(S.lvl>=MAXL)S.xp=Math.min(S.xp,need(MAXL))}
function blob(cx,cy,r,o){cx|=0;cy|=0;r|=0;for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){if(x*x+y*y>r*r)continue;
 const l=cl((-x*.5-y)/r*.5+.5+(hs((x+cx)*7.3+(y+cy)*13.1+o)-.5)*.55+(((x+y)&1)?.04:-.04),0,.999);px(cx+x,cy+y,LEAF[l*4|0])}}
function drawFl(f){const x=cl(Math.round(CX+f.dx*U),3,W-3),b=GY,sw=Math.round(Math.sin(time*1.6+x)*.7);
 if(f.t==0){const h=3+(f.s*3|0);rc(x,b-h,1,h,'#3f8f3a');px(x-1,b-2,'#4caf3d');px(x+1,b-3,'#4caf3d');px(x+sw-1,b-h,'#fff8');px(x+sw+2,b-h-1,'#fff8');px(x+sw,b-h-2,'#fff8');rc(x+sw,b-h-1,2,2,['#ff6b8b','#ffd166','#f8f4ff','#b78cff'][f.c*4|0])}
 else if(f.t==1){rc(x,b-2,1,2,'#efe6d0');rc(x-1,b-4,3,2,'#d64545');px(x,b-4,'#fff')}
 else if(f.t==2){const c='#2f7d32';px(x,b-1,c);px(x,b-2,c);[[1,2],[2,3],[3,3],[4,2]].forEach(([i,h])=>{px(x-i,b-h,c);px(x+i,b-h,c)})}
 else if(f.t==3){const o=ctx;blob(x,b-4,4+(f.s*2|0),x)}
 else{rc(x,b-9,1,9,'#3f8f3a');rc(x-1+sw,b-12,3,3,'#ffd166');px(x+sw,b-11,'#7a4a1a')}}
let br=[];
function mkBranches(){br=[];const R=i=>hs(S.seed*5.3+i*1.37);let k=0;
 for(let i=0;i<10;i++){const fr=.42+.55*i/9+(R(k++)-.5)*.04;br.push({fr,d:i%2?1:-1,lf:.8+R(k++)*.4,a:.5+R(k++)*.35,tw:[.3+R(k++)*.1,.55+R(k++)*.1,.8+R(k++)*.1]})}}
const smooth=t=>t*t*(3-2*t),stg=g=>g<.12?'Csíra':g<.4?'Csemete':g<.7?'Fiatal fa':g<1?'Lombosodó fa':'Kifejlett fa';
function leafPx(x,y,d,s,c){rc(x,y,s+1,s>1?2:1,c);if(s>1)px(x+(d>0?s:0),y-1,c)}
function seg(x0,y0,x1,y1,c,th){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))|0;for(let j=0;j<=n;j++)rc(x0+(x1-x0)*j/(n||1),y0+(y1-y0)*j/(n||1),th||1,1,c)}
// csíranövény: sziklevelek, majd valódi levelek, csúcsrügy
function seedling(g,hT,tx,top){const cot=g<.07?1:cl(1-(g-.07)/.05,0,1);
 if(cot>.1){leafPx(tx-4,GY-3,-1,2,'#a8e063');leafPx(tx+1,GY-3,1,2,'#a8e063')}
 const n=cl((g-.03)/.025,0,4)|0;
 for(let j=0;j<n;j++){const ly=GY-4-j*3,r=j%2;if(GY-ly>hT)break;leafPx(tx+(r?2:-4),ly,r?1:-1,2,'#4caf3d');px(tx+(r?3:-3),ly,'#8bd84e')}
 rc(tx,top-2,1,2,'#d6f78c')}
function drawTree(g){if(!S.pl)return;
 const HF=3+84*U,hT=3+g*84*U,sw=Math.sin(time*1.1)*(.5+g*2.4)*U,tw=g<.12?1:2+(g*6*U|0),top=GY-hT,tx=CX+sw,L=S.lvl,
  fl=L>=MAXL?1:cl(S.xp/need(L),0,1),cf=smooth(cl((g-.4)/.55,0,1)),yt=g<.12?hT:Math.max(3,hT*.07);
 if(g>.08){const sr=(5+g*34)*U;ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(CX-sr|0,GY,2*sr|0,2);ctx.fillRect(CX-sr*.7|0,GY+2,1.4*sr|0,1)}
 // törzs: kúpos, a friss (zöld) csúcshajtás alatt fásodott kéreg, évgyűrű-hegekkel
 for(let i=0;i<hT;i++){const f=i/hT,ox=sw*f*f,w2=Math.max(1,Math.round(tw*(1-.5*f)+(i<tw?(tw-i)>>1:0)));
  for(let k=0;k<w2;k++){const m=k/(w2-1||1),n=hs(i*3+k*7);let c;
   if(i>hT-yt)c=k%2?'#9cc55c':'#7fae4a';
   else{c=m<.25?'#3a2412':m>.75?'#9a6a3e':'#6b4426';if(hs(k*9.7+S.seed)>.72&&m>.1&&w2>3)c='#3b2413';else if(n>.86)c='#3b2413';else if(n<.08)c='#a87a4a';if(i==(hT-yt|0)&&w2>1)c='#4a2f1a'}
   rc(CX-(w2>>1)+k+ox,GY-1-i,1,1,c)}}
 if(g<.12){seedling(g,hT,tx,top);return}
 // oldalágak: az alsók a legrégebbiek és a leghosszabbak, felfelé újabbak
 const tips=[{x:tx,y:top,d:0,big:1}];
 br.forEach(b=>{const nh=HF*b.fr;if(nh>hT-4)return;const age=cl((hT-nh)/(HF*.5),0,1),len=(8+30*(1-Math.abs(b.fr-.7)*1.5))*U*b.lf*age;if(len<2)return;
  const f=nh/hT,bx=CX+sw*f*f+b.d*(tw>>1),by=GY-nh,P=q=>[bx+b.d*Math.cos(b.a)*q+sw*.3*(q/len),by-Math.sin(b.a)*q+q*q/len*.55];
  let p0=P(0);for(let q=2;q<=len;q+=2){const p1=P(q);seg(p0[0],p0[1],p1[0],p1[1],q>len*.8?'#8a9a4a':'#5a3820',q<len*.35?2:1);
   if(cf<.6&&q%4==0)leafPx(p1[0],p1[1]-1,b.d,1+(fl*1.5|0),'#4caf3d');p0=p1}
  tips.push({x:p0[0],y:p0[1],d:b.d,big:1});
  b.tw.forEach((t,j)=>{const pp=P(len*t),tl=len*.38*(1-.3*t),ex=pp[0]+b.d*tl*.8,ey=pp[1]-tl*(j%2?.7:-.1);seg(pp[0],pp[1],ex,ey,'#6a5a30');tips.push({x:ex,y:ey,d:b.d,big:0})})});
 // lombkorona: csak később, a fa magasodásával fejlődik (cf), a hajtásvégeken kezdődik
 const rC=3+36*U;
 if(cf>.25){const r=rC*cf;blob(tx-r*.6,top+r*.25,r*.62,1);blob(tx+r*.6,top+r*.25,r*.62,2);blob(tx,top-r*.1,r,3);blob(tx,top-r*.55,r*.6,4)}
 if(cf>.04)tips.forEach((t,i)=>blob(t.x,t.y,(1.5+(t.big?7:5)*U*cf)*(t.d==0?1.3:1),9+i));
 if(cf>.3){const r=rC*cf;for(let i=0;i<r*2;i++){const a=hs(i*1.7)*6.283,d=Math.sqrt(hs(i*2.9))*r*.95,x=tx+Math.cos(a)*d,y=top-r*.1+Math.sin(a)*d*.9;
  if(Math.sin(time*.8+i)>-.4)px(x,y,y<top-r*.1?'#d6f78c':'#173f20')}}
 // rügyfakadás és hajtásnövekedés: minden szint elején zárt rügyek, majd a hajtás megnyúlik, a levelek kibomlanak
 tips.forEach(t=>{const z=t.big?2:1;
  if(fl<.25){rc(t.x,t.y-1,z,z+1,'#6b3a22');px(t.x,t.y-z-1,fl>.12?'#b6e86a':'#c4563a')}
  else{const q=(fl-.25)/.75,sl=q*(t.big?7:4)*U,n=t.big?3:2;seg(t.x,t.y,t.x+t.d*sl*.4,t.y-sl,'#9cc55c');
   for(let j=1;j<=n;j++){const o=j%2?-1:1;leafPx(t.x+t.d*sl*.4*j/(n+1)+o,t.y-sl*j/(n+1),o,1+(q*2.2|0),q<.6?'#c9f27a':'#7fcf4a')}
   px(t.x+t.d*sl*.4,t.y-sl-1,'#e3ffa0')}});

 for(let x=0;x<W;x++){let h=22+Math.sin(x*.02+2)*9+Math.sin(x*.07)*3;rc(x,GY-h,1,h,rgb(lA([16,28,48],[110,150,170],dayf)));h=12+Math.sin(x*.035+1)*7+Math.sin(x*.09)*2;rc(x,GY-h,1,h,rgb(lA([22,38,50],[96,160,120],dayf)));

 const rg=S.pl?cl(.08+g*1.1,0,1):0;
 for(const o of roots){const f=o.s?cl((rg-.4)/.6,0,1):rg,n=o.p.length*f|0;
  for(let j=0;j<n;j++){const[x,y]=o.p[j];px(x,y,j==n-1?'#f3e0b8':'#d8b27c');if(!o.s&&j<10)px(x+1,y,'#b88f58')}}
 ents.forEach(e=>{if(e.k=='ant'||e.k=='worm'||e.k=='bug')drawEnt(e)});
 const cover=S.pl?Math.min(W/2+4,(8+L*13)*U):0,dens=cl(.2+L*.1,0,1);
 for(let x=0;x<W;x++){const d=Math.abs(x-CX);if(d>cover||(pw&&x>=10&&x<10+pw))continue;
  if(hs(x*3.1+S.seed)>dens*(1-d/cover*.6))continue;

  for(let i=0;i<h;i++)px(x+(i==h-1?Math.round(sw):0),GY-1-i,i>h*.6?'#9be15d':i>h*.3?'#4caf3d':'#2f7d32')}
 S.fl.forEach(drawFl);drawTree(g);
 if(S.pl){const c2=Math.min(W/2,(10+L*12)*U);for(let x=CX-c2;x<CX+c2;x+=2){if(pw&&x>=10&&x<10+pw)continue;const r=hs(x*2.3+S.seed*3);if(r>.55)continue;const h=(2+((r*9|0)%4)+(L>4?1:0))*U|0,sw=Math.round(Math.sin(time*2+x*.3)*(h>2?1:0));for(let i=0;i<h;i++)px(x+(i==h-1?sw:0),GY-1-i,i>h*.6?'#b6f26a':'#3f9a35')}}
 ents.forEach(e=>{if(e.k!='ant'&&e.k!='worm'&&e.k!='bug'&&e.k!='ff')drawEnt(e)});ctx.fillStyle='rgba(10,20,70,'+(1-dayf)*.38+')';ctx.fillRect(0,0,W,H);if(dayf<.6)ents.forEach(e=>{if(e.k=='ff'){const a=(Math.sin(time*2+e.ph*3)+1)/2,y=e.y+Math.sin(time+e.ph)*4;ctx.fillStyle='rgba(255,240,120,'+a*.25+')';ctx.fillRect(e.x-2|0,y-2|0,5,5);rc(e.x,y,1,1,'rgba(255,250,200,'+a+')')}})

 for(const q of parts){if(q.k=='seed'){rc(q.x-1,q.y,3,4,'#c8923c');px(q.x,q.y,'#f0c060')}else if(q.k=='d'){rc(q.x,q.y,1,3,'#4aa8f0');px(q.x,q.y,'#cfeeff')}else rc(q.x,q.y,1,1,q.c)}

function update(dt){
 if(S.pl){S.wat=Math.max(0,S.wat-.02*dt);if(S.wat>.1)gain(.04*dt);if(S.lvl>=5&&Math.random()<dt*.7)parts.push({k:'z',x:CX+(Math.random()-.5)*S.lvl*7,y:GY-40-S.lvl*7,vx:7,vy:9,l:5,c:'#8bd84e'})}

 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;
  if(p.k=='d'||p.k=='seed')p.vy+=140*dt;else if(p.k=='s')p.vy+=60*dt;

  if(p.l<=0)parts.splice(i,1)}
 if((acc+=dt)>5){acc=0;save()}}

let AC,mg,bus,muted=localStorage.getItem('fs_mute')=='1',ci=0;
const mtof=m=>440*2**((m-69)/12),CH=[[45,57,60,64,67,71],[41,53,57,60,64,67],[48,55,60,64,67,71],[43,55,59,62,66,69]],PE=[69,72,74,76,79,81,84];
function note(m,t,d,ty,g,a){const o=AC.createOscillator(),v=AC.createGain();o.type=ty;o.frequency.value=mtof(m);v.gain.setValueAtTime(.0001,t);v.gain.linearRampToValueAtTime(g,t+a);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(bus);o.start(t);o.stop(t+d+.1)}
